<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.1, maximum-scale=10, user-scalable=yes, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0d1117" />
  <title>SamVNC &mdash; Remote Desktop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Compact top bar; collapses to a hamburger on narrow screens. -->
  <div id="topbar">
    <button id="menuBtn" title="Menu" aria-label="Menu">≡</button>
    <div class="brand">SamVNC</div>
    <div class="status" id="status">connecting…</div>
    <div class="spacer"></div>
    <span id="stats" class="stats"></span>
    <button id="fsBtn" title="Fullscreen" aria-label="Fullscreen">⛶</button>
  </div>

  <!-- Dropdown menu for the less-frequently-used controls (Quality, Mode,
       Clipboard). Hidden on wide screens where the inline controls remain. -->
  <div id="menuPanel" class="hidden">
    <label class="ctl">Quality
      <select id="quality">
        <option value="1" selected>Low (fast)</option>
        <option value="2">Medium</option>
        <option value="3">High (sharp)</option>
      </select>
    </label>
    <label class="ctl">Mode
      <select id="mode">
        <option value="0" selected>Auto</option>
        <option value="1">P2P</option>
        <option value="2">Relay</option>
      </select>
    </label>
    <label class="ctl">Input
      <select id="touchMode">
        <option value="direct" selected>Direct touch</option>
        <option value="trackpad">Trackpad (relative)</option>
      </select>
    </label>
    <button id="clipBtn">Clipboard</button>
    <button id="resetZoom">Reset zoom</button>
  </div>

  <!-- Inline controls for wide screens. -->
  <div id="inlineControls" class="wide-only">
    <label class="ctl">Quality
      <select id="qualityInline">
        <option value="1" selected>Low (fast)</option>
        <option value="2">Medium</option>
        <option value="3">High (sharp)</option>
      </select>
    </label>
    <label class="ctl">Mode
      <select id="modeInline">
        <option value="0" selected>Auto</option>
        <option value="1">P2P</option>
        <option value="2">Relay</option>
      </select>
    </label>
  </div>

  <div id="stage">
    <canvas id="screen" tabindex="0"></canvas>
    <!-- Virtual cursor used in trackpad mode. -->
    <div id="cursor" class="hidden"></div>
    <!-- Pinch-zoom wrapper: we transform the canvas inside this element. -->
    <div id="overlay" class="hidden">
      <div class="dialog">
        <h2 id="overlayTitle">Disconnected</h2>
        <p id="overlayMsg"></p>
        <button id="reconnect">Reconnect</button>
      </div>
    </div>
    <!-- Floating zoom indicator (shown when zoomed). -->
    <div id="zoomBadge" class="hidden"></div>
  </div>

  <!-- Mobile toolbar: visible on touch devices and narrow screens. -->
  <div id="mobileBar">
    <button id="kbBtn" title="Keyboard" aria-label="Keyboard">⌨</button>
    <button id="fnBtn" title="Function keys" aria-label="Function keys">Fn</button>
    <button id="mouseModeBtn" title="Mouse buttons" aria-label="Mouse buttons">🖱</button>
    <button id="zoomBtn" title="Zoom" aria-label="Zoom">⊕</button>
  </div>

  <!-- Hidden textarea that receives soft-keyboard input. We use a textarea
       (not input) so it can hold newlines, which lets us detect Enter via
       value-diffing. Mobile IMEs (Gboard, Sogou) often don't fire keydown
       or beforeinput for Backspace/Enter, so we infer them from value
       changes on the 'input' event. -->
  <textarea id="kbInput" rows="1" autocomplete="off" autocorrect="off"
            autocapitalize="off" spellcheck="false"></textarea>

  <!-- Function-key panel: sticky modifiers + common keys. -->
  <div id="fnPanel" class="hidden">
    <div class="fn-row" id="fnMods">
      <button data-mod="ctrl">Ctrl</button>
      <button data-mod="alt">Alt</button>
      <button data-mod="shift">Shift</button>
      <button data-mod="meta">Super</button>
      <button class="fn-close" title="Close">✕</button>
    </div>
    <div class="fn-row">
      <button data-key="Escape" data-code="Escape">Esc</button>
      <button data-key="Tab" data-code="Tab">Tab</button>
      <button data-key="Backspace" data-code="Backspace">⌫</button>
      <button data-key="Enter" data-code="Enter">⏎</button>
      <button data-key="Space" data-code="Space">␣</button>
    </div>
    <div class="fn-row">
      <button data-key="ArrowUp" data-code="ArrowUp">↑</button>
      <button data-key="ArrowLeft" data-code="ArrowLeft">←</button>
      <button data-key="ArrowDown" data-code="ArrowDown">↓</button>
      <button data-key="ArrowRight" data-code="ArrowRight">→</button>
    </div>
    <div class="fn-row">
      <button data-key="Home" data-code="Home">Home</button>
      <button data-key="End" data-code="End">End</button>
      <button data-key="PageUp" data-code="PageUp">PgUp</button>
      <button data-key="PageDown" data-code="PageDown">PgDn</button>
      <button data-key="Insert" data-code="Insert">Ins</button>
      <button data-key="Delete" data-code="Delete">Del</button>
    </div>
    <div class="fn-row">
      <button data-key="F1" data-code="F1">F1</button>
      <button data-key="F2" data-code="F2">F2</button>
      <button data-key="F3" data-code="F3">F3</button>
      <button data-key="F4" data-code="F4">F4</button>
      <button data-key="F5" data-code="F5">F5</button>
      <button data-key="F6" data-code="F6">F6</button>
    </div>
    <div class="fn-row">
      <button data-key="F7" data-code="F7">F7</button>
      <button data-key="F8" data-code="F8">F8</button>
      <button data-key="F9" data-code="F9">F9</button>
      <button data-key="F10" data-code="F10">F10</button>
      <button data-key="F11" data-code="F11">F11</button>
      <button data-key="F12" data-code="F12">F12</button>
    </div>
  </div>

  <!-- Mouse-button chooser: tap to select active button (L/M/R) for the
       next tap. Useful when remote app needs right-click frequently. -->
  <div id="mousePanel" class="hidden">
    <div class="mouse-row">
      <button data-btn="1" class="active">Left</button>
      <button data-btn="2">Middle</button>
      <button data-btn="4">Right</button>
    </div>
    <div class="mouse-row">
      <button id="mouseDrag">Drag lock: off</button>
      <button id="mouseScroll">Scroll mode: off</button>
    </div>
    <div class="mouse-row">
      <button class="mouse-close">✕</button>
    </div>
  </div>

  <div id="clipboardBar" class="hidden">
    <span>Clipboard (auto-sync Ctrl+C/V) ·</span>
    <textarea id="clipText" placeholder="Shared clipboard (Ctrl+C / Ctrl+V auto-sync)…"></textarea>
    <button id="clipSend">Send</button>
  </div>

  <script src="client.js"></script>
</body>
</html>
