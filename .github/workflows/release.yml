# SamVNC release pipeline.
#
# POLICY: every release ships EXACTLY SIX assets — one self-contained
# samvnc-tray binary per supported platform/arch. Nothing else:
#
#   samvnc-tray-linux-amd64        samvnc-tray-darwin-amd64
#   samvnc-tray-linux-arm64        samvnc-tray-darwin-arm64
#   samvnc-tray-linux-arm          samvnc-tray-windows-amd64.exe
#
# Since v1.7.0 the tray binary embeds the full server stack in-process
# (internal/serverapp), so there are NO separate samvnc-server assets and
# no per-platform archives — one binary IS the product. The install.sh
# one-liner depends on these exact asset names.
#
# Triggered by pushing a tag:  git tag v1.7.0 && git push origin v1.7.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: pure Go (X11 via xgb, tray via dbus) — cross-compile, no cgo.
          - { os: linux, arch: amd64, runs-on: ubuntu-latest, cgo: "0", ext: "" }
          - { os: linux, arch: arm64, runs-on: ubuntu-latest, cgo: "0", ext: "" }
          - { os: linux, arch: arm, runs-on: ubuntu-latest, cgo: "0", goarm: "7", ext: "" }
          # macOS: cgo required (AppKit tray + native settings dialog).
          # Both arches build on macos-14 (Apple Silicon): the amd64 slice is
          # cross-compiled with cgo (-arch x86_64 via the universal SDK) —
          # macos-13 (Intel) runners are scarce and being deprecated, which
          # left release builds stuck in queue for hours.
          - { os: darwin, arch: amd64, runs-on: macos-latest, cgo: "1", ext: "" }
          - { os: darwin, arch: arm64, runs-on: macos-latest, cgo: "1", ext: "" }
          # Windows: pure Go (GDI tray) — cross-compilable, but build natively
          # so resource/icon handling stays consistent.
          # -H=windowsgui: GUI subsystem — no black console window on launch
          # (logs go to ~/.samvnc/tray.log; children use CREATE_NO_WINDOW).
          - { os: windows, arch: amd64, runs-on: windows-latest, cgo: "0", ext: ".exe", ld: "-H=windowsgui" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build samvnc-tray
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w ${{ matrix.ld }}" \
            -o "dist/samvnc-tray-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" \
            ./cmd/samvnc-tray

      - name: Smoke test (version output must not crash)
        shell: bash
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          file dist/samvnc-tray-linux-amd64

      - name: Locate Inno Setup (ISCC)
        id: iscc
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "ISCC not found, installing via Chocolatey..."
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Resolve Chinese language file
        if: matrix.os == 'windows'
        id: cnisl
        shell: pwsh
        run: |
          $innoDir = Split-Path "${{ steps.iscc.outputs.path }}"
          $found = Get-ChildItem -Path $innoDir -Recurse -Filter "ChineseSimplified.isl" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            $cn = $found.FullName
          } else {
            $cn = Join-Path $env:RUNNER_TEMP "ChineseSimplified.isl"
            $urls = @(
              "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_4_1/Files/Languages/Unofficial/ChineseSimplified.isl",
              "https://raw.githubusercontent.com/jrsoftware/issrc/is-7_1_1/Files/Languages/ChineseSimplified.isl"
            )
            $ok = $false
            foreach ($u in $urls) {
              try { Invoke-WebRequest -Uri $u -OutFile $cn; $ok = $true; break } catch { Write-Host "miss: $u" }
            }
            if (-not $ok) { throw "Cannot obtain ChineseSimplified.isl" }
          }
          "path=$cn" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build setup.exe (Inno Setup)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item dist/samvnc-tray-windows-amd64.exe packaging/
          Copy-Item assets/tray_icon.ico packaging/
          & "${{ steps.iscc.outputs.path }}" "/DMyAppVersion=$v" "/DCnMessages=${{ steps.cnisl.outputs.path }}" "/DSetupIcon=tray_icon.ico" "/DOutputBaseFilename=SamVNC-$v-windows-amd64-setup" /Q packaging/samvnc.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Move-Item packaging/dist/*.exe dist/
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: samvnc-tray-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release (exactly six tray assets)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist/
          count=$(ls dist/ | wc -l)
          if [ "$count" -lt 6 ]; then
            echo "Expected >= 6 tray assets (+ optional windows setup.exe), found $count — aborting." >&2
            exit 1
          fi
          # Create the release; if it already exists (rerun), just replace assets.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "samvnc $TAG" \
            --notes "Single self-contained binary per platform: \`samvnc-tray\` embeds the full server AND the pinned aitun tunnel client — no extra downloads, the tunnel works out of the box. Install: \`curl -fsSL https://samai.cc/samvnc/install.sh | bash\`" \
            || gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # ---------------------------------------------------------------------------
  # Mirror release artifacts to ModelScope + HuggingFace and update the unified
  # catalog (samaidev/samai-releases). Tag pushes only, after Release job.
  # ---------------------------------------------------------------------------
  mirror-catalog:
    name: Mirror (MS/HF) + update catalog
    needs: [release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install upload SDKs
        run: pip install huggingface_hub modelscope

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir assets --repo "$GITHUB_REPOSITORY"
          ls -lh assets

      - name: Fetch current catalog (single source of truth)
        run: |
          curl -fsSL -o catalog.json \
            https://raw.githubusercontent.com/samaidev/samai-releases/main/catalog.json

      - name: Mirror to MS/HF + update catalog
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python ci/publish_channels.py \
            --dist assets --product samvnc --version "$GITHUB_REF_NAME" \
            --repo samaidev/samvnc --catalog catalog.json \
            --glob "samvnc"
